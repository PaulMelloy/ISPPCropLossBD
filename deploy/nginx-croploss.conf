# /etc/nginx/sites-available/croploss  (symlink into sites-enabled)
# After this works over HTTP, run:  sudo certbot --nginx -d croploss.example.org
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name croploss.example.org;

  location / {
    proxy_pass         http://127.0.0.1:3838/croploss/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host $host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 20d;
    proxy_buffering    off;
  }
}
